name = "capa-sync"
main = "worker.js"
compatibility_date = "2024-11-01"

# Base de données (KV) : créez-la puis collez son id ci-dessous.
#   Via wrangler :  wrangler kv:namespace create CAPA_STATE
#   Via dashboard  : Workers & Pages → KV → Create namespace « CAPA_STATE » → copier l'ID
[[kv_namespaces]]
binding = "CAPA_STATE"
id = "COLLEZ_ICI_L_ID_DE_VOTRE_NAMESPACE"

# [optionnel] Protection par token : décommentez et définissez la variable
#   wrangler secret put CAPA_TOKEN   (ou dans le dashboard : Settings → Variables)
# [vars]
# CAPA_TOKEN = "remplacez-par-votre-token"
